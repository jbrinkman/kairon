repo: "jbrinkman/kairon"
label: "kairon"
poll_interval: 1m
max_retries: 3
console_logging: false
enable_copilot_review: false

# Base branch for new issue worktrees (optional).
# When unset, Kairon auto-detects the repository's default branch.
# Uncomment to force a specific branch (e.g. main, develop).
# base_branch: main

# Theme selection (optional, defaults to 'default')
# Available themes: default, high-contrast, light
theme: "high-contrast"

# Session configuration
session:
  max_history_messages: 100
  max_age: 24h
  sessions_dir: ".kairon/sessions"

# Logging configuration
logging:
  default_level: "info"
  max_buffer_lines: 10000
  max_file_size_mb: 100
  log_dir: ".kairon/logs"

# Sandbox configuration (optional, for containerized agent execution)
# sandbox:
#   image: "alpine:3.19"           # Docker image for agent containers
#   workspace_dir: "/workspace"    # Working directory inside container
#   cpu_cores: 1.0                 # CPU limit in cores
#   memory_mb: 1024                # Memory limit in megabytes
#   timeout: "5m"                  # Maximum execution time

# Model pricing (optional). Used to turn token counts into a dollar cost.
# - Keys are EXACT model ids, matched as written (no trimming, no case folding).
# - Prices are USD per million tokens, for input and output separately.
# - A model with no entry has an UNKNOWN cost: it is reported as unknown and
#   its runs are marked cost-incomplete. It is never priced as another model.
# - Setting this key REPLACES the built-in defaults (it is not merged with
#   them), so remove an entry to make that model's cost unknown. If the key is
#   omitted entirely, the built-in Sonnet defaults below apply.
# - claude-haiku-4.5 is intentionally unpriced: it may run (it is in
#   evals.allowed_models) but its cost is reported as unknown until you add a
#   price for it.
pricing:
  claude-sonnet-5.5:
    input_usd_per_mtok: 3
    output_usd_per_mtok: 15
  claude-sonnet-5:
    input_usd_per_mtok: 3
    output_usd_per_mtok: 15
  claude-sonnet-4.6:
    input_usd_per_mtok: 3
    output_usd_per_mtok: 15
  claude-sonnet-4.5:
    input_usd_per_mtok: 3
    output_usd_per_mtok: 15
  claude-sonnet-4:
    input_usd_per_mtok: 3
    output_usd_per_mtok: 15

# Eval model pinning (optional). Applies to `kairon eval`.
# Every agent call and judge call is pinned to a model; a run is refused before
# any case starts if the effective agent model or the judge model is empty,
# "auto", or not in allowed_models.
# evals:
#   agent_model: ""                 # override the agent-under-test model; default: the "model" in its agent config
#   judge_model: "claude-sonnet-5.5"
#   allowed_models:
#     - "claude-sonnet-5.5"
#     - "claude-sonnet-5"
#     - "claude-sonnet-4.6"
#     - "claude-sonnet-4.5"
#     - "claude-sonnet-4"
#     - "claude-haiku-4.5"
