name: stub-step-records
description: "Self-test: a workflow agent's dispatch tool writes step records to .eval/calls.jsonl; they are imported as workspace call records and counted in agent_cost"
agent: selftest-workflow
input: |
  Summarize the attached self-test input document.
setup:
  - type: file
    label: "Self-test Input"
    path: ".kairon/evals/fixtures/selftest-input.md"
context:
  - "This case runs against the deterministic stub backend"
  - "The stub turn appends two valid step records to .eval/calls.jsonl; agent_cost is the outer stub usage (100/40) plus the two imported records (10/5 and 20/10)"
expected_output: |
  A short summary with a top-level section and at least one subsection.
stub:
  turns:
    - response: |
        ## Summary

        The workflow agent dispatched its design and build steps.

        ### Details

        Both steps reported their usage in .eval/calls.jsonl.
      model: stub-model
      usage:
        input_tokens: 100
        output_tokens: 40
      commands:
        - |
          printf '%s\n' '{"role":"agent","agent":"selftest-step-a","step":"design","model":"stub-model","input_tokens":10,"output_tokens":5,"cost_usd":0.000105,"estimated":false,"duration_ms":1}' >> .eval/calls.jsonl
        - |
          printf '%s\n' '{"role":"agent","agent":"selftest-step-b","step":"build","model":"stub-model","input_tokens":20,"output_tokens":10,"cost_usd":0.00021,"estimated":false,"duration_ms":1}' >> .eval/calls.jsonl
