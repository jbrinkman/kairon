name: check-changed-files
description: "Self-test (fail): changed_files fails and names every path changed outside allow"
agent: selftest-fail
workspace: seeded
input: |
  Delete a seeded file, add a new one and report that you did.
context:
  - "This case runs against the deterministic stub backend"
  - "Expected to FAIL: the check cannot pass: docs/notes.txt is deleted and extra.txt is added, outside allow [README.md]"
expected_output: |
  A short report with a top-level section and at least one subsection.
stub:
  turns:
    - commands:
        - "rm docs/notes.txt"
        - "echo extra > extra.txt"
      response: |
        ## Checks

        The stub turn finished and reported output marker alpha.

        ### Details

        This response carries the headings the report format expects.
checks:
  - criterion: structural_completeness
    type: changed_files
    allow: [README.md]
