name: check-judge-yes
description: "Self-test: a judge check passes when the judge answers yes and records its reasoning"
agent: selftest
input: |
  Review the work and report what you found.
context:
  - "This case runs against the deterministic stub backend"
  - "Passes: stub.judge answers yes"
expected_output: |
  A short report with a top-level section and at least one subsection.
stub:
  judge: yes
  turns:
    - response: |
        ## Checks

        The stub turn finished and reported output marker alpha.

        ### Details

        This response carries the headings the report format expects.
checks:
  - criterion: structural_completeness
    type: judge
    question: "Does the report describe what the stub turn finished?"
