name: check-changed-files
description: "Self-test: changed_files passes when only allowed paths changed; .eval/ is ignored"
agent: selftest
workspace: seeded
input: |
  Append a line to the seeded README and report that you did.
context:
  - "This case runs against the deterministic stub backend"
  - "Passes: README.md is modified (allowed) and .eval/note.txt is ignored"
expected_output: |
  A short report with a top-level section and at least one subsection.
stub:
  turns:
    - commands:
        - "echo 'appended by the stub' >> README.md"
        - "echo note > .eval/note.txt"
      response: |
        ## Checks

        The stub turn finished and reported output marker alpha.

        ### Details

        This response carries the headings the report format expects.
checks:
  - criterion: structural_completeness
    type: changed_files
    allow: [README.md]
