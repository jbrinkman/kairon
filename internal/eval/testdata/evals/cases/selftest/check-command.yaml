name: check-command
description: "Self-test: command checks pass on exit 0 and on a non-zero expect_exit"
agent: selftest
input: |
  Create built.txt and report that you did.
context:
  - "This case runs against the deterministic stub backend"
  - "Passes: 'test -f built.txt' exits 0 and 'exit 3' matches expect_exit 3"
expected_output: |
  A short report with a top-level section and at least one subsection.
stub:
  turns:
    - commands:
        - "echo built > built.txt"
      response: |
        ## Checks

        The stub turn finished and reported output marker alpha.

        ### Details

        This response carries the headings the report format expects.
checks:
  - criterion: structural_completeness
    type: command
    run: "test -f built.txt"
  - criterion: structural_completeness
    type: command
    run: "exit 3"
    expect_exit: 3
