name: check-file-absent
description: "Self-test: file_absent passes when the file was never created"
agent: selftest
input: |
  Report without creating any file.
context:
  - "This case runs against the deterministic stub backend"
  - "Passes: nothing creates missing.txt"
expected_output: |
  A short report with a top-level section and at least one subsection.
stub:
  turns:
    - response: |
        ## Checks

        The stub turn finished and reported output marker alpha.

        ### Details

        This response carries the headings the report format expects.
checks:
  - criterion: structural_completeness
    type: file_absent
    path: missing.txt
