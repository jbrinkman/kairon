name: check-gh-log-not-contains
description: "Self-test: gh_log_not_contains passes when no gh call matches (an empty log passes vacuously)"
agent: selftest
input: |
  Report without merging any pull request.
context:
  - "This case runs against the deterministic stub backend"
  - "Passes: no gh pr merge call is logged"
expected_output: |
  A short report with a top-level section and at least one subsection.
stub:
  turns:
    - response: |
        ## Checks

        The stub turn finished and reported output marker alpha.

        ### Details

        This response carries the headings the report format expects.
checks:
  - criterion: structural_completeness
    type: gh_log_not_contains
    pattern: "gh pr merge"
