name: check-file-exists
description: "Self-test: file_exists passes when the agent created the file"
agent: selftest
input: |
  Create the marker file and report that you did.
context:
  - "This case runs against the deterministic stub backend"
  - "Passes: the stub turn writes marker.txt"
expected_output: |
  A short report with a top-level section and at least one subsection.
stub:
  turns:
    - commands:
        - "echo hi > marker.txt"
      response: |
        ## Checks

        The stub turn finished and reported output marker alpha.

        ### Details

        This response carries the headings the report format expects.
checks:
  - criterion: structural_completeness
    type: file_exists
    path: marker.txt
