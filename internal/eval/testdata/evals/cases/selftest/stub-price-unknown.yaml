name: stub-price-unknown
description: "Self-test: a model with no configured price records an unknown cost and marks the totals incomplete"
agent: selftest
input: |
  Describe what the self-test verifies.
context:
  - "This case runs against the deterministic stub backend"
expected_output: |
  A short description with a top-level section and at least one subsection.
stub:
  turns:
    - response: |
        ## Self-test

        The self-test verifies the harness runs end to end without a real model.

        ### Pricing

        Cost is unknown because no price is configured for the model.
      model: claude-haiku-4.5
      usage:
        input_tokens: 1000
        output_tokens: 500
