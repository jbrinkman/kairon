name: sim-routes
description: "Self-test: a simulated-user elicitation case; the stub routes the agent's first question to fact f1 (answered verbatim) and its second to none (default_reply), and the fact checks read the sim log"
agent: selftest
input: "I want a feature that exports reports as CSV"
simulated_user:
  facts:
    - id: f1
      answer: "SIM-F1-ANSWER: comma separated, UTF-8, one header row."
      discoverable: false
    - id: f2
      answer: "SIM-F2-ANSWER: the service is written in Go."
      discoverable: true
  default_reply: "SIM-DEFAULT-REPLY: I don't know, use your best judgement."
  max_turns: 3
context:
  - "This case runs against the deterministic stub backend; no model is called"
  - "The stub routes the first agent question to f1 and the second to none; the third turn ends the simulated phase"
expected_output: |
  A short report with a top-level section and at least one subsection.
stub:
  routes: [f1, none]
  turns:
    - response: |
        ## Questions

        SIM-TURN-ONE-MARKER: which file format should the export use?

        ### Details

        Waiting for the answer before drafting anything.
    - response: |
        ## Questions

        SIM-TURN-TWO-MARKER: how large are the reports?

        ### Details

        Still waiting for details.
    - response: |
        ## Draft

        SIM-TURN-THREE-MARKER: the draft is ready.

        ### Details

        No further questions.
checks:
  - criterion: structural_completeness
    type: fact_asked
    fact: f1
  - criterion: structural_completeness
    type: fact_not_asked
    fact: f2
  - criterion: structural_completeness
    type: output_contains
    pattern: "SIM-TURN-ONE-MARKER"
    turn: 1
  - criterion: structural_completeness
    type: output_contains
    pattern: "SIM-TURN-TWO-MARKER"
    turn: 2
  - criterion: structural_completeness
    type: output_contains
    pattern: "SIM-TURN-THREE-MARKER"
    turn: 3
