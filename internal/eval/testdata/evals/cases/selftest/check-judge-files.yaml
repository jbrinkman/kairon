name: check-judge-files
description: "Self-test: a judge check with files reads the workspace artifact and passes on yes"
agent: selftest
input: |
  Review the work and report what you found.
context:
  - "This case runs against the deterministic stub backend"
  - "Passes: the stub turn writes .eval/issue-body.md and the judge check lists it"
expected_output: |
  A short report with a top-level section and at least one subsection.
stub:
  judge: yes
  turns:
    - commands:
        - "echo '# Issue body' > .eval/issue-body.md"
      response: |
        ## Checks

        The stub turn finished and reported output marker alpha.

        ### Details

        This response carries the headings the report format expects.
checks:
  - criterion: structural_completeness
    type: judge
    question: "Does the issue body file state a testable acceptance criterion?"
    files: [.eval/issue-body.md]
