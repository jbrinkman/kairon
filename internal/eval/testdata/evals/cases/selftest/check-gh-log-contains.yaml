name: check-gh-log-contains
description: "Self-test: gh_log_contains passes when .eval/gh.log has a matching call"
agent: selftest
input: |
  Record a gh issue create call and report that you did.
context:
  - "This case runs against the deterministic stub backend"
  - "Passes: the stub appends a gh issue create line to .eval/gh.log (the native run has no real gh log)"
expected_output: |
  A short report with a top-level section and at least one subsection.
stub:
  turns:
    - commands:
        - 'echo "gh issue create --title t" >> .eval/gh.log'
      response: |
        ## Checks

        The stub turn finished and reported output marker alpha.

        ### Details

        This response carries the headings the report format expects.
checks:
  - criterion: structural_completeness
    type: gh_log_contains
    pattern: "(?m)^gh issue create"
