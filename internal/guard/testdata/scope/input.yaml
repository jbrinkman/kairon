body: |-
  ## Problem Statement

  Retries are unbounded, so a failing issue loops forever.

  ## Context

  The retry loop lives in `internal/agent`.

  ## Scope

  ### In Scope

  - `internal/agent`: cap the attempts per issue
  - `docs/retries.md`: document the cap
  - `.kairon/config.yaml`: a `max_attempts` setting

  ### Out of Scope

  - Changing the backoff delay (#901)

  ## Acceptance Criteria

  1. The third failed attempt stops the loop.
     Verify: `go test ./internal/agent/... -run TestRetryCap` exits 0.
  2. The docs name the setting.
     Verify: `grep -c max_attempts docs/retries.md` prints at least `1`.

  Dependencies: none
