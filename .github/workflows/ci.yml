name: CI

on:
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate PR
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      
    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: '1.26.5'
        cache: true
        
    - name: Install Task
      uses: arduino/setup-task@v3
      with:
        version: 3.53.1
        repo-token: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Format check
      run: task fmt:check

    - name: Template sync check
      run: task sync:check
      
    - name: Lint
      run: task lint
      
    - name: Test
      run: task test
      
    - name: Build
      run: task build
